services:
  - type: web
    name: little-racer-invitation-free
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: RENDER_DATA_DIR
        value: /tmp/little-racer-data
      - key: DATA_DIR
        value: /tmp/little-racer-data/data
      - key: UPLOADS_DIR
        value: /tmp/little-racer-data/uploads
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: VITE_RSVP_SCRIPT_URL
        sync: false
